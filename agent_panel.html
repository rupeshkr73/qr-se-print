<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Se Print — Print Agent</title>
<!--
  ══════════════════════════════════════════════════════════════
  QR SE PRINT — DESKTOP PANEL  (v2.4)

  Ye panel JAAN-BOOJH KAR chhota hai. Pehle isme 9 page the (Shop
  Settings, Pricing, Payment, Advanced, QR, Support, Updates...) —
  wo sab website dashboard par pehle se hain, aur wahi asli jagah
  hai. Shop ke PC par sirf teen cheezon ki zaroorat padti hai:

     1. Agent zinda hai ya nahi
     2. Kaunsa printer B&W ka hai, kaunsa Color ka
     3. Kuch atka lage to Sync

  Baaki sab kaam tray menu se hota hai (Logs, Contact Admin,
  Check for Update, Change Shop ID, Reconnect, Exit) — TRAY KO
  CHHUA NAHI GAYA hai.

  EK CHHUPA HUA PAGE: 'upgrade' (Demo → Paid). Main screen par
  kahin nahi dikhta. Tray ka "⚡ Change Demo ID to Paid Shop"
  Python se go('upgrade') call karta hai, tabhi khulta hai.
  Isse tray ka wo option zinda rehta hai aur design saaf rehta hai.
  ══════════════════════════════════════════════════════════════
-->
<style>
  /* Shop ke PC par system dark mode ho to form control ulte rang
     me na dikhein — panel hamesha light hai. */
  :root { color-scheme: light; }

  :root{
    --bg:        #ffffff;
    --ink:       #0b1220;
    --ink-2:     #334155;
    --muted:     #94a3b8;
    --line:      #eef0f6;
    --card:      #ffffff;
    --card-line: #e9ecf5;

    --green:     #16a34a;
    --green-d:   #128a3e;
    --indigo:    #3b32cf;
    --indigo-d:  #322ab4;

    --pink-bg:   #fdeef2;
    --pink-line: #f8d5de;
    --pink:      #ec4899;

    --ok:        #16a34a;
    --warn:      #d97706;
    --bad:       #dc2626;

    --r:         16px;
    --shadow:    0 1px 2px rgba(15,23,42,.04), 0 8px 24px rgba(15,23,42,.05);
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
    font-size:15px;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  .wrap{
    max-width:880px;
    margin:0 auto;
    padding:14px 22px 8px;
  }

  /* ── HEADER ── */
  .hero{ text-align:center; padding:0 0 12px; }
  .logo{
    width:66px; height:66px; margin:0 auto 8px;
    border-radius:20px;
    background:linear-gradient(150deg,#ff5fa2 0%,#f0326c 48%,#e11d48 100%);
    box-shadow:0 8px 22px rgba(225,29,72,.28);
    display:flex; align-items:center; justify-content:center;
  }
  .logo svg{ width:39px; height:39px; display:block; }
  .brand{
    font-size:28px; font-weight:800; letter-spacing:-.6px;
    line-height:1.1; margin:0 0 4px;
  }
  .status{
    display:inline-flex; align-items:center; gap:8px;
    font-size:14.5px; font-weight:600; color:var(--ink-2);
  }
  .dot{
    width:9px; height:9px; border-radius:50%;
    background:var(--ok); flex:none;
    box-shadow:0 0 0 3px rgba(22,163,74,.15);
  }
  .dot.warn{ background:var(--warn); box-shadow:0 0 0 3px rgba(217,119,6,.15); }
  .dot.bad { background:var(--bad);  box-shadow:0 0 0 3px rgba(220,38,38,.15); }

  /* ── INFO CARD ── */
  .card{
    background:var(--card);
    border:1px solid var(--card-line);
    border-radius:var(--r);
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .row{
    display:flex; align-items:center; gap:14px;
    padding:10px 18px;
    border-bottom:1px solid var(--line);
  }
  .row:last-child{ border-bottom:0; }
  .ico{
    width:36px; height:36px; border-radius:10px; flex:none;
    display:flex; align-items:center; justify-content:center;
  }
  .ico svg{ width:20px; height:20px; }
  .ico.pk{ background:#ffe3ee; color:#e11d63; }
  .ico.ind{ background:#e6e8fd; color:#4338ca; }
  .ico.pu{ background:#efe6fd; color:#7c3aed; }
  .ico.gr{ background:#d9fbe6; color:#12924a; }
  .ico.bl{ background:#dbeafe; color:#1d4ed8; }
  .rlabel{ flex:1; font-size:15px; font-weight:600; color:var(--ink-2); }
  .rval{
    font-size:15px; font-weight:800; color:var(--ink);
    text-align:right; max-width:52%;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .pill{
    display:inline-flex; align-items:center; gap:7px;
    background:#d9fbe6; color:#0f7a3d;
    font-size:13.5px; font-weight:800;
    padding:6px 13px; border-radius:999px;
  }
  .pill.warn{ background:#fef3c7; color:#92400e; }
  .pill.bad { background:#fee2e2; color:#b91c1c; }
  .pill i{ width:8px; height:8px; border-radius:50%; background:currentColor; }

  /* ── PRINTER CARD ── */
  .pcard{
    margin-top:12px;
    background:var(--pink-bg);
    border:1px solid var(--pink-line);
    border-radius:var(--r);
    padding:14px 18px;
    display:flex; align-items:center; gap:16px;
  }
  .ptitle{ display:flex; align-items:center; gap:12px; flex:none; }
  .ptitle .ico{ background:#ffd9e6; color:#e11d63; }
  .ptitle b{ font-size:17px; font-weight:800; letter-spacing:-.2px; }
  .pgrid{ flex:1; display:grid; grid-template-columns:1fr 1fr; gap:14px; min-width:0; }
  .pgrid label{
    display:block; font-size:12px; font-weight:800;
    color:#7c5866; margin:0 0 5px;
  }
  select{
    width:100%; height:42px;
    padding:0 34px 0 12px;
    font-family:inherit; font-size:14px; font-weight:600; color:var(--ink);
    background:#fff url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E") no-repeat right 11px center;
    background-size:16px;
    border:1px solid #f0cfda; border-radius:11px;
    -webkit-appearance:none; appearance:none;
    cursor:pointer; text-overflow:ellipsis;
  }
  select:focus{ outline:none; border-color:var(--pink); box-shadow:0 0 0 3px rgba(236,72,153,.14); }
  select:disabled{ opacity:.55; cursor:default; }

  /* ── BUTTONS ── */
  /* Ab teen button hain, isliye font thoda chhota — warna "Refresh Printer
     List" 900px window me toot kar do line me chala jaata hai. */
  .btns{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:11px; margin-top:12px; }
  .btn{
    height:52px; border:0; border-radius:13px;
    font-family:inherit; font-size:14.5px; font-weight:800; color:#fff;
    display:flex; align-items:center; justify-content:center; gap:10px;
    cursor:pointer; transition:transform .12s, filter .12s;
  }
  .btn svg{ width:20px; height:20px; }
  .btn:hover:not(:disabled){ filter:brightness(1.06); }
  .btn:active:not(:disabled){ transform:translateY(1px); }
  .btn:disabled{ opacity:.6; cursor:default; }
  .btn.green { background:var(--green);  box-shadow:0 6px 16px rgba(22,163,74,.26); }
  .btn.indigo{ background:var(--indigo); box-shadow:0 6px 16px rgba(59,50,207,.26); }
  /* Save ka rang gulabi hai — wahi rang jo upar "Select Printer" card ka
     hai. Isse aankh ko turant samajh aata hai ki ye button us card se juda
     hai. Do hare button ek saath confuse karte. */
  .btn.rose  { background:#e11d63;      box-shadow:0 6px 16px rgba(225,29,99,.26); }

  /* Demo -> Paid — sirf demo shop par dikhta hai */
  .btn.amber { background:linear-gradient(135deg,#f59e0b,#d97706); color:#fff;
               box-shadow:0 6px 16px rgba(217,119,6,.28); }
  #demoRow{ display:none; margin-top:9px; }
  body.is-demo #demoRow{ display:block; }
  #demoRow .btn{ width:100%; height:43px; font-size:13.5px; }
  #demoRow p{
    margin:5px 2px 0; font-size:11px; line-height:1.45;
    color:#92400e; text-align:center; font-weight:600;
  }
  .spin{ animation:sp .9s linear infinite; }
  @keyframes sp{ to{ transform:rotate(360deg); } }

  .foot{
    text-align:center; color:var(--muted);
    font-size:12.5px; font-weight:600;
    padding:8px 0 2px;
  }

  /* ── TOAST ── */
  .toast{
    position:fixed; left:50%; bottom:22px; transform:translate(-50%,140%);
    background:#0b1220; color:#fff;
    font-size:14px; font-weight:700;
    padding:12px 20px; border-radius:12px;
    box-shadow:0 12px 32px rgba(2,6,23,.3);
    display:flex; align-items:center; gap:10px;
    transition:transform .26s cubic-bezier(.2,.9,.3,1.2);
    /* Upgrade page (#up) ka z-index 80 hai. Pehle toast 60 par tha,
       isliye upgrade screen par HAR error toast overlay ke PEECHE chhup
       jaata tha — shop owner ko sirf form wapas aata dikhta tha aur
       wajah kabhi pata nahi chalti thi. */
    z-index:200; max-width:82%;
  }
  .toast.show{ transform:translate(-50%,0); }
  .toast.ok  { background:#0f7a3d; }
  .toast.err { background:#b91c1c; }

  /* ══════════════════════════════════════════════════════════
     UPGRADE (Demo → Paid) — CHHUPA HUA
     Main screen par kabhi nahi dikhta. Sirf tray ke
     "⚡ Change Demo ID to Paid Shop" se khulta hai, jo Python se
     go('upgrade') call karta hai.
     ══════════════════════════════════════════════════════════ */
  #up{ display:none; position:fixed; inset:0; background:var(--bg); z-index:80; overflow:auto; }
  body.upgrade #up{ display:block; }
  body.upgrade .wrap{ display:none; }
  .upw{ max-width:520px; margin:0 auto; padding:26px 22px; }
  .uph{ text-align:center; margin-bottom:18px; }
  .uph h2{ font-size:23px; font-weight:800; margin:0 0 6px; letter-spacing:-.4px; }
  .uph p{ margin:0; color:var(--ink-2); font-size:14px; line-height:1.6; }
  .fld{ margin-bottom:13px; }
  .fld label{ display:block; font-size:12.5px; font-weight:800; color:var(--ink-2); margin-bottom:6px; }
  .fld input{
    width:100%; height:46px; padding:0 13px;
    font-family:inherit; font-size:15px; font-weight:600; color:var(--ink);
    border:1.5px solid #dfe3ee; border-radius:11px; background:#fff;
  }
  .fld input:focus{ outline:none; border-color:var(--indigo); box-shadow:0 0 0 3px rgba(59,50,207,.13); }
  .btn.ghost{ background:#fff; color:var(--ink-2); border:1.5px solid #dfe3ee; box-shadow:none; }
  .btn.wide{ width:100%; margin-top:4px; }
  .kv{
    display:flex; justify-content:space-between; gap:14px;
    padding:11px 0; border-bottom:1px solid var(--line); font-size:14.5px;
  }
  .kv:last-child{ border-bottom:0; }
  .kv span{ color:var(--ink-2); font-weight:600; }
  .kv b{ font-weight:800; }
  .note{
    background:#fff7ed; border:1px solid #fed7aa; color:#9a3412;
    border-radius:12px; padding:12px 14px; font-size:13px;
    line-height:1.65; margin-bottom:14px;
  }
  .note.good{ background:#f0fdf4; border-color:#bbf7d0; color:#166534; }
  .busy{ text-align:center; padding:40px 0; color:var(--ink-2); font-weight:700; }
  /* Upgrade form par error TOAST se nahi, yahin dikhta hai — toast 5 second
     me chala jaata hai aur shop owner ko dobara padhne ka mauka nahi milta. */
  #upErr{
    display:none; margin-bottom:13px;
    background:#fef2f2; border:1.5px solid #fecaca; color:#b91c1c;
    border-radius:12px; padding:11px 14px;
    font-size:13px; font-weight:700; line-height:1.6;
  }
  #upErr.show{ display:block; }

  @media (max-width:820px){
    .pcard{ flex-direction:column; align-items:stretch; gap:12px; }
    .pgrid{ grid-template-columns:1fr; }
    .btns{ grid-template-columns:1fr; }
  }
</style>
</head>

        <rect x="11" y="10" width="4"  height="4"  fill="#f0326c"/>

<script>
/* ══════════════════════════════════════════════════════════════
   BRIDGE — har privileged kaam Python karta hai.
   Token kabhi is JS me nahi aata.

   ZAROORI: pywebview `window.pywebview.api` ko ASYNC inject karta
   hai. Isliye "bridge hai ya nahi" ye CALL ke waqt poochhte hain,
   parse ke waqt nahi. Pehle ek purane build me ye const tha —
   wo hamesha false capture ho jaata tha aur panel ka har call
   chupchaap demo data par chala jaata tha.
   ══════════════════════════════════════════════════════════════ */
function hasPy(){ return !!(window.pywebview && window.pywebview.api); }

async function py(fn){
  var args = Array.prototype.slice.call(arguments, 1);
  if(!hasPy()) return mock(fn);
  try{
    if(!window.pywebview.api[fn]) throw new Error('Is build me ye available nahi: ' + fn);
    return await window.pywebview.api[fn].apply(null, args);
  }catch(e){
    console.error('bridge', fn, e);
    return { ok:false, error:(e && e.message) ? e.message : String(e) };
  }
}

/* Browser me kholo to design test ho sake — exe me kabhi nahi chalta */
function mock(fn){
  var S = {
    get_state:{ ok:true, shopId:'SHOP_ECB1AB8A', shopName:'Mahato Net Cafe',
      shopType:'demo', connection:'online', version:'2.4', latestVersion:'2.4',
      updateAvailable:false, printerBw:'Canon G2010 series',
      printerColor:'Canon G2010 series' },
    get_printers:{ ok:true, printers:['Canon G2010 series','EPSON L130 Series',
      'HP LaserJet M1005','Microsoft Print to PDF'] }
  };
  return Promise.resolve(S[fn] || { ok:true, mock:true });
}

/* ── HELPERS ── */
function $(id){ return document.getElementById(id); }
function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

var toastT = null;
function toast(msg, kind){
  var el = $('toast');
  $('toastIco').textContent = kind==='err' ? '✕' : (kind==='ok' ? '✓' : 'i');
  $('toastMsg').textContent = msg;
  el.className = 'toast show ' + (kind||'');
  clearTimeout(toastT);
  toastT = setTimeout(function(){ el.className = 'toast ' + (kind||''); },
                      kind==='err' ? 5200 : 3200);
}

function spin(on, btnId, icoId){
  var b = $(btnId), i = $(icoId);
  b.disabled = !!on;
  if(i) i.classList.toggle('spin', !!on);
}

/* ── STATE ── */
var ST = {}, PRINTERS = [], lastSyncAt = 0, busy = false;

/* "Now" / "12s ago" / "3 min ago" — design me "Now" likha hai, aur
   asli baat bhi yahi hai: agent abhi-abhi server se baat kar chuka. */
function syncText(){
  if(!lastSyncAt) return '—';
  var s = Math.round((Date.now() - lastSyncAt) / 1000);
  if(s < 10)   return 'Now';
  if(s < 60)   return s + 's ago';
  var m = Math.round(s / 60);
  return m + (m === 1 ? ' min ago' : ' min ago');
}

function paint(){
  // Demo hai ya paid — SERVER batata hai (get_state -> shopType).
  // Shop ID ke text se guess nahi karte.
  document.body.classList.toggle('is-demo', (ST.shopType || '') === 'demo');

  $('vName').textContent = ST.shopName || '—';
  $('vId').textContent   = ST.shopId   || '—';

  var v = ST.version ? ('v' + ST.version) : '—';
  $('vVer').textContent = ST.updateAvailable
    ? (v + ' → v' + (ST.latestVersion || '?') + ' available')
    : (ST.version ? v + ' (Latest)' : v);

  var conn = ST.connection || 'connecting';
  var pill = $('vConn'), dot = $('sDot'), txt = $('sTxt');
  pill.className = 'pill' + (conn==='online' ? '' : (conn==='offline' ? ' bad' : ' warn'));
  pill.innerHTML = '<i></i>' + (conn==='online' ? 'Yes' : (conn==='offline' ? 'No' : '…'));
  dot.className  = 'dot'  + (conn==='online' ? '' : (conn==='offline' ? ' bad' : ' warn'));
  txt.textContent = conn==='online' ? 'Print Agent Online'
                  : (conn==='offline' ? 'Print Agent Offline' : 'Connecting…');

  $('vSync').textContent = syncText();
}

/* ── PRINTERS ── */
function fillPrinters(){
  [['selBw', ST.printerBw], ['selColor', ST.printerColor]].forEach(function(pair){
    var sel = $(pair[0]), cur = pair[1] || '';
    var html = '<option value="">— Windows ka default printer —</option>';
    var seen = false;
    PRINTERS.forEach(function(p){
      if(p === cur) seen = true;
      html += '<option value="' + esc(p) + '">' + esc(p) + '</option>';
    });
    // Shop ne jo printer set kiya hai wo abhi list me na mile (band hai /
    // driver hata diya) to bhi use dikhao — warna chup-chaap default par
    // chala jaata aur owner ko pata bhi nahi chalta.
    if(cur && !seen){
      html += '<option value="' + esc(cur) + '">' + esc(cur) + '  (abhi nahi mila)</option>';
    }
    sel.innerHTML = html;
    sel.value = cur;
    sel.disabled = false;
  });
}

async function loadPrinters(){
  var r = await py('get_printers');
  PRINTERS = (r && r.ok && r.printers) ? r.printers : [];
  fillPrinters();
}

async function onPrinterChange(){
  if(busy) return;
  var bw = $('selBw').value, cl = $('selColor').value;
  busy = true;
  var r = await py('save_printers', bw, cl);
  busy = false;
  if(r && r.ok){
    ST.printerBw = bw; ST.printerColor = cl;
    toast('Printer save ho gaya', 'ok');
  }else{
    toast((r && r.error) || 'Printer save nahi hua', 'err');
    fillPrinters();          // server ne nahi liya — purani value wapas dikhao
  }
}

/* ── ACTIONS ── */
/* Save button.

   Asli save dropdown badalte hi ho chuka hota hai (onPrinterChange).
   Ye button uske upar PAKKA jawab dene ke liye hai: wahi selection
   dobara server ko bhejta hai aur uske jawab par bolta hai.

   Sirf "save ho chuka hai" likh dena aasan tha, par jhooth ho sakta tha
   — auto-save ke waqt net gaya ho to shop owner ko pata hi nahi chalta.
   Isliye ye sach me server se confirm karta hai. Dobara bhejna safe hai. */
async function doSave(){
  spin(true, 'btnSave', 'icoSave');
  var bw = $('selBw').value, cl = $('selColor').value;
  var r = await py('save_printers', bw, cl);
  spin(false, 'btnSave', 'icoSave');
  if(r && r.ok){
    ST.printerBw = bw; ST.printerColor = cl;
    toast('Printer save ho gaya — server par yahi set hai', 'ok');
  }else{
    toast((r && r.error) || 'Save nahi hua — net check karo', 'err');
    fillPrinters();          // server ne nahi liya — purani value wapas
  }
}

async function doSync(){
  spin(true, 'btnSync', 'icoSync');
  var r = await py('sync_now');
  await refresh();
  spin(false, 'btnSync', 'icoSync');
  if(r && r.ok) toast('Server se sync ho gaya', 'ok');
  else          toast((r && r.error) || 'Server tak nahi pahunche', 'err');
}

async function doRefreshPrinters(){
  spin(true, 'btnRef', 'icoRef');
  var r = await py('refresh_printers');
  await loadPrinters();
  spin(false, 'btnRef', 'icoRef');
  if(r && r.ok) toast(PRINTERS.length + ' printer mile', 'ok');
  else          toast((r && r.error) || 'Printer list nahi mili', 'err');
}

/* ── REFRESH ── */
async function refresh(){
  var s = await py('get_state');
  if(s && s.ok){
    ST = s;
    if((s.connection || '') === 'online') lastSyncAt = Date.now();
    paint();
  }
}

/* ══════════════════════════════════════════════════════════════
   UPGRADE (Demo → Paid) — chhupa hua page

   Python se aata hai:  window.evaluate_js("go('upgrade')")
   Isliye go() global hona ZAROORI hai — agent_panel.py ka
   _goto_pending_page() aur open_upgrade() dono isi ko call karte hain.
   ══════════════════════════════════════════════════════════════ */
var UP = { step:1 };

function go(id){
  if(id === 'upgrade'){ UP = { step:1 }; document.body.classList.add('upgrade'); upRender(); }
  else                { document.body.classList.remove('upgrade'); }
}
function upClose(){ document.body.classList.remove('upgrade'); refresh(); }

function upRender(){
  var h = '';
  if(UP.step === 1){
    h = '<div class="uph"><h2>Demo se Paid Shop</h2>'
      + '<p>Apni <b>paid Shop ID</b> aur password daalo. Yahi agent usi shop par '
      + 'chalne lagega — na reinstall, na restart.</p></div>'
      + '<div id="upErr" class="' + (UP.err ? 'show' : '') + '">' + esc(UP.err || '') + '</div>'
      + '<div class="fld"><label>Paid Shop ID</label>'
      + '<input id="upId" placeholder="SHOP_XXXXXXXX" autocomplete="off" spellcheck="false" value="'
      + esc(UP.lastId || '') + '"></div>'
      + '<div class="fld"><label>Shop Password</label>'
      + '<input id="upPw" type="password" placeholder="••••••" autocomplete="off"></div>'
      + '<button class="btn indigo wide" onclick="upVerify()">Verify karo</button>'
      + '<div style="height:10px"></div>'
      + '<button class="btn ghost wide" onclick="upClose()">Wapas</button>';
  }
  else if(UP.step === 2){
    h = '<div class="busy">Ek minute… server se baat ho rahi hai</div>';
  }
  else if(UP.step === 3){
    h = '<div class="uph"><h2>Shop mil gayi</h2><p>Sahi shop hai? Confirm karo.</p></div>'
      + '<div class="card" style="padding:4px 16px;margin-bottom:14px">'
      + '<div class="kv"><span>Shop Name</span><b>' + esc(UP.shopName || '') + '</b></div>'
      + '<div class="kv"><span>Shop ID</span><b>' + esc(UP.shopId || '') + '</b></div>'
      + (UP.planType ? '<div class="kv"><span>Plan</span><b>' + esc(UP.planType) + '</b></div>' : '')
      + '</div>'
      + (UP.alreadyLinked
          ? '<div class="note">Is shop par pehle se ek doosra computer juda hai. '
            + 'Aage badhoge to wo PC hat jayega aur printing IS PC par aa jayegi.</div>'
          : '')
      + '<button class="btn indigo wide" onclick="upSwitch()">Paid Shop par switch karo</button>'
      + '<div style="height:10px"></div>'
      + '<button class="btn ghost wide" onclick="UP={step:1};upRender()">← Doosri Shop ID</button>';
  }
  else if(UP.step === 5){
    h = '<div class="uph"><h2>Ho gaya 🎉</h2>'
      + '<p>Ye agent ab aapki paid shop par chal raha hai.</p></div>'
      + '<div class="card" style="padding:4px 16px;margin-bottom:14px">'
      + '<div class="kv"><span>Shop Name</span><b>' + esc(UP.shopName || '') + '</b></div>'
      + '<div class="kv"><span>Shop ID</span><b>' + esc(UP.shopId || '') + '</b></div></div>'
      + (UP.warning ? '<div class="note">' + esc(UP.warning) + '</div>'
                    : '<div class="note good">Printing chalu hai. Kuch aur karne ki zaroorat nahi.</div>')
      + '<button class="btn green wide" onclick="upClose()">Theek hai</button>';
  }
  $('upBody').innerHTML = h;
}

async function upVerify(){
  var id = ($('upId') || {}).value || '';
  var pw = ($('upPw') || {}).value || '';
  if(!id.trim()) return toast('Paid Shop ID daalo', 'err');
  if(!pw)        return toast('Shop password daalo', 'err');
  UP.step = 2; upRender();
  var r = await py('verify_paid_shop', id.trim(), pw);
  if(!r || !r.ok){
    // Error form me hi rakho (toast chala jaata hai), aur Shop ID wapas
    // bhar do taaki dobara poora type na karna pade.
    UP = { step:1, err:(r && r.error) || 'Verify nahi hua — net check karo',
           lastId:id.trim() };
    upRender();
    toast(UP.err, 'err');
    return;
  }
  UP = { step:3, shopId:r.shopId, shopName:r.shopName,
         planType:r.planType, alreadyLinked:r.alreadyLinked };
  upRender();
}

async function upSwitch(){
  var keep = UP;
  UP = { step:2 }; upRender();
  var r = await py('convert_to_paid');
  if(!r || !r.ok){
    UP = { step:1, err:(r && r.error) || 'Switch fail hua', lastId:(keep && keep.shopId) || '' };
    upRender();
    toast(UP.err, 'err');
    return;
  }
  UP = { step:5, shopId:r.shopId, shopName:r.shopName, warning:r.warning };
  upRender();
  await refresh();          // ab shopType 'paid' aayega -> demo button khud hat jayega
}

/* ── BOOT ── */
async function boot(){
  await refresh();
  await loadPrinters();
  // State har 6s, aur "Last Sync" ka text har second (warna wo jama rehta hai)
  setInterval(refresh, 6000);
  setInterval(function(){ if(!document.body.classList.contains('upgrade')) $('vSync').textContent = syncText(); }, 1000);
}

window.addEventListener('pywebviewready', boot);
// Browser me kholo to 'pywebviewready' kabhi fire nahi hota — tab bhi
// design dikhna chahiye, isliye ye fallback.
setTimeout(function(){ if(!hasPy()) boot(); }, 700);
</script>
